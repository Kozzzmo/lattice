name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64 -DLATTICE_BUILD_TOOLS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target Lattice_VST3 Lattice_Standalone LatticeTests --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': (fatal )?error' | Select-Object -First 25 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Unit tests
        run: build\LatticeTests_artefacts\Release\LatticeTests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\Lattice_artefacts\Release\VST3\Lattice.vst3 dist\
          Copy-Item build\Lattice_artefacts\Release\Standalone\Lattice.exe dist\
          Compress-Archive -Path dist\* -DestinationPath Lattice-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Lattice-windows
          path: Lattice-windows.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lattice-windows.zip
